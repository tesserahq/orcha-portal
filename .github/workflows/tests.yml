name: Tests

on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}

jobs:
  tests:
    uses: tesserahq/ci-workflows/.github/workflows/portal-tests.yml@a9831c8da88a47d135c8c071d2c08a238806d2ba # v0.3.0
    with:
      bun-version: '1.3.11'
