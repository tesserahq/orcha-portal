name: Push
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: mustela/orcha-portal
          flavor: latest=false
          tags: |
            type=raw,value=main
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Check out infrastructure repository
        uses: actions/checkout@v7
        with:
          repository: mylinden-tech/infra
          ref: main
          path: infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}

      - name: Open production image update pull request
        env:
          GH_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          cd infra
          ./scripts/update-image-digest.sh \
            production/apps/orcha-portal/Dockerfile \
            mustela/orcha-portal \
            "$IMAGE_DIGEST"
          if git diff --quiet; then
            echo "Production already references $IMAGE_DIGEST"
            exit 0
          fi
          branch="deploy/orcha-portal-$RELEASE_SHA"
          short_sha=$(printf '%s' "$RELEASE_SHA" | cut -c1-12)
          git config user.name "orcha-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add production/apps/orcha-portal/Dockerfile
          git commit -m "Deploy Orcha portal $short_sha"
          git push origin "$branch"
          gh pr create \
            --repo mylinden-tech/infra \
            --head "$branch" \
            --base main \
            --title "Deploy Orcha portal $short_sha" \
            --body "Promotes the Orcha portal image from source commit \`$RELEASE_SHA\` as immutable digest \`$IMAGE_DIGEST\`. Merging this PR triggers the protected rolling portal deployment."
